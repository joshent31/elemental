plugins {
	id "com.android.application"
}

dependencies {
	implementation "com.journeyapps:zxing-android-embedded:4.3.0"
}

def elementalDebugKeystore = project.findProperty("ELEMENTAL_DEBUG_KEYSTORE")
def elementalForkJavac = project.findProperty("ELEMENTAL_FORK_JAVAC") == "true"
def elementalJavac = project.findProperty("ELEMENTAL_JAVAC")

android {
	namespace "com.elementalfixtures.mobile"
	compileSdk 34

	defaultConfig {
		applicationId "com.elementalfixtures.mobile"
		minSdk 24
		targetSdk 34
		versionCode 2
		versionName "1.1.0"
	}

	signingConfigs {
		if (elementalDebugKeystore) {
			elementalDebug {
				storeFile file(elementalDebugKeystore)
				storePassword "android"
				keyAlias "androiddebugkey"
				keyPassword "android"
			}
		}
	}

	buildTypes {
		debug {
			if (elementalDebugKeystore) {
				signingConfig signingConfigs.elementalDebug
			}
		}
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}
}

if (elementalForkJavac) {
	tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach { task ->
		task.options.fork = true
		if (elementalJavac) {
			task.options.forkOptions.executable = elementalJavac
		}
	}
}
