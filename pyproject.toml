[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "elemental_erp"
version = "0.1.0"
description = "Retail Furniture Manufacturing tracking app (Job -> Design/Costing -> Purchase -> Production -> Packaging -> Dispatch) with QR-based process tracking, built on Frappe/ERPNext v15+"
readme = "README.md"
license = { file = "license.txt" }
authors = [{ name = "Elemental Fixtures Pvt Ltd", email = "dev@elemental.com" }]
requires-python = ">=3.10"
dependencies = ["frappe", "qrcode[pil]"]

[project.urls]
"Source" = "https://github.com/joshent31/elemental"

[tool.flit.module]
name = "elemental_erp"
